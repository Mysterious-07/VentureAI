<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — VentureAI</title>
<meta name="description" content="Reset your VentureAI account password.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__logo">
      <span class="logo-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 17 4.5 17 11C17 14.5 15.5 17 15.5 17H8.5C8.5 17 7 14.5 7 11C7 4.5 12 2 12 2Z" fill="white"/><circle cx="12" cy="10" r="2" fill="#5B3FE4"/><path d="M8.5 17L6 21L9 19.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 17L18 21L15 19.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="navbar__brand">VentureAI</span>
    </a>

    <nav class="navbar__nav" id="navbar-nav" aria-label="Primary">
      <ul>
        <li><a href="index.html#features" class="nav-link">Features</a></li>
        <li><a href="index.html#about" class="nav-link">About Us</a></li>
      </ul>
    </nav>

    <div class="navbar__actions" data-navbar-actions>
      <a href="login.html" class="btn btn--outline">Login</a>
      <a href="register.html" class="btn btn--primary" data-ripple>Get Started</a>
    </div>

    <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="mobile-nav" id="mobile-nav">
    <ul>
      <li><a href="index.html#features" class="nav-link">Features</a></li>
      <li><a href="index.html#about" class="nav-link">About Us</a></li>
    </ul>
    <div class="mobile-nav__actions" data-navbar-actions>
      <a href="login.html" class="btn btn--outline">Login</a>
      <a href="register.html" class="btn btn--primary" data-ripple>Get Started</a>
    </div>
  </div>
</header>

<main>
<section class="auth-section">
  <div class="container auth-section__inner auth-section__inner--single">

    <div class="auth-card reveal">
      <div class="auth-card__header">
        <span class="badge">Reset Password</span>
        <h1 class="auth-card__title">Forgot your password?</h1>
        <p class="auth-card__desc">Enter the email linked to your account and we'll send you a link to reset your password.</p>
      </div>

      <form id="forgot-password-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <p class="form-msg" id="forgot-password-msg" role="alert" aria-live="polite"></p>

        <button type="submit" class="btn btn--primary btn--lg auth-submit" data-ripple>
          <span class="btn-text">Send Reset Link</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="auth-footer-text"><a href="login.html">&larr; Back to login</a></p>
    </div>

  </div>
</section>
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer footer--simple">
  <div class="container">
    <a href="index.html" class="navbar__logo">
      <span class="logo-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 17 4.5 17 11C17 14.5 15.5 17 15.5 17H8.5C8.5 17 7 14.5 7 11C7 4.5 12 2 12 2Z" fill="white"/><circle cx="12" cy="10" r="2" fill="#5B3FE4"/></svg></span>
      <span class="navbar__brand navbar__brand--light">VentureAI</span>
    </a>
    <p>&copy; 2026 VentureAI. All rights reserved.</p>
  </div>
</footer>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
