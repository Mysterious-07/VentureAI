<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Mentors — VentureAI</title>
<meta name="description" content="Discover experienced mentors who can help you move your startup forward.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/mentor-profile.css">
<link rel="stylesheet" href="css/mentor-discovery.css">
</head>
<body data-protected>

<!-- ================= NAVBAR ================= -->
<header class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__logo">
      <span class="logo-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 17 4.5 17 11C17 14.5 15.5 17 15.5 17H8.5C8.5 17 7 14.5 7 11C7 4.5 12 2 12 2Z" fill="white"/><circle cx="12" cy="10" r="2" fill="#5B3FE4"/><path d="M8.5 17L6 21L9 19.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 17L18 21L15 19.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="navbar__brand">VentureAI</span>
    </a>

    <nav class="navbar__nav" id="navbar-nav" aria-label="Primary">
      <ul></ul>
    </nav>

    <div class="navbar__actions" data-navbar-actions></div>

    <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="mobile-nav" id="mobile-nav">
    <ul></ul>
    <div class="mobile-nav__actions" data-navbar-actions></div>
  </div>
</header>

<main>

<div class="dashboard-loading">
  <div class="dashboard-loading__spinner" aria-label="Verifying your session"></div>
</div>

<div class="dashboard-content">
  <section class="dashboard-main">
    <div class="container">

      <!-- Page Header -->
      <div class="discovery-header">
        <h1>Find Your <span class="text-gradient">Mentor</span></h1>
        <p>Connect with experienced mentors who can help you move your startup forward.</p>
      </div>

      <!-- Search Bar -->
      <div class="discovery-search" id="discovery-search">
        <span class="discovery-search__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <input type="text" class="discovery-search__input" id="search-input" placeholder="Search by name, expertise, industry, role…" autocomplete="off">
        <button type="button" class="discovery-search__clear" id="search-clear" aria-label="Clear search">×</button>
      </div>

      <!-- Filter + Sort Toolbar -->
      <div class="discovery-toolbar" id="discovery-toolbar">
        <div class="discovery-toolbar__filters" id="filter-container">
          <!-- Industry Filter -->
          <div class="filter-dropdown" id="filter-industry" data-filter="industry">
            <button type="button" class="filter-dropdown__btn" id="btn-filter-industry">
              Industry
              <svg class="filter-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="filter-dropdown__panel" id="panel-filter-industry"></div>
          </div>
          <!-- Expertise Filter -->
          <div class="filter-dropdown" id="filter-expertise" data-filter="expertise">
            <button type="button" class="filter-dropdown__btn" id="btn-filter-expertise">
              Expertise
              <svg class="filter-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="filter-dropdown__panel" id="panel-filter-expertise"></div>
          </div>
          <!-- Startup Stage Filter -->
          <div class="filter-dropdown" id="filter-stage" data-filter="startup_stage">
            <button type="button" class="filter-dropdown__btn" id="btn-filter-stage">
              Stage
              <svg class="filter-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="filter-dropdown__panel" id="panel-filter-stage"></div>
          </div>
          <!-- Availability Filter -->
          <div class="filter-dropdown" id="filter-availability" data-filter="availability">
            <button type="button" class="filter-dropdown__btn" id="btn-filter-availability">
              Availability
              <svg class="filter-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="filter-dropdown__panel" id="panel-filter-availability"></div>
          </div>
          <!-- Clear Filters -->
          <button type="button" class="discovery-clear-btn" id="btn-clear-filters" style="display:none;">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M9 3L3 9M3 3l6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Clear Filters
          </button>
        </div>

        <div class="discovery-toolbar__right">
          <span class="discovery-result-count" id="result-count"></span>
          <select class="sort-select" id="sort-select" aria-label="Sort mentors">
            <option value="relevance">Sort: Relevance</option>
            <option value="experience">Sort: Experience</option>
            <option value="availability">Sort: Availability</option>
          </select>
        </div>
      </div>

      <!-- Mentor Grid (cards, skeletons, empty state, error state) -->
      <div id="mentor-grid-container">
        <div class="discovery-grid" id="mentor-grid"></div>
      </div>

      <!-- Pagination -->
      <div class="discovery-pagination" id="pagination-container" style="display:none;"></div>

    </div>
  </section>
</div>

</main>

<!-- Toast notification -->
<div class="profile-toast" id="discovery-toast"></div>

<!-- ================= FOOTER ================= -->
<footer class="footer footer--simple">
  <div class="container">
    <a href="index.html" class="navbar__logo">
      <span class="logo-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 17 4.5 17 11C17 14.5 15.5 17 15.5 17H8.5C8.5 17 7 14.5 7 11C7 4.5 12 2 12 2Z" fill="white"/><circle cx="12" cy="10" r="2" fill="#5B3FE4"/></svg></span>
      <span class="navbar__brand navbar__brand--light">VentureAI</span>
    </a>
    <p>&copy; 2026 VentureAI. All rights reserved.</p>
  </div>
</footer>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
<script src="js/route-guard.js"></script>
<script src="js/mentor-discovery.js"></script>
</body>
</html>
